  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #000; color: #fff; height: 100vh; overflow: hidden; }

    #bg-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.38); z-index: 1; }

    /* ── CARD ── */
    .card { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; min-width: 280px; }

    /* ── AVATAR ── */
    .avatar-wrap { position: relative; width: 82px; height: 82px; border-radius: 50%; }
    .avatar-wrap img.pfp { width: 82px; height: 82px; border-radius: 50%; object-fit: cover; border: 2.5px solid rgba(255,255,255,0.25); display: block; }
    #decoration-ring { position: absolute; top: -10px; left: -10px; width: 102px; height: 102px; pointer-events: none; z-index: 2; }
    .avatar-status { position: absolute; bottom: 4px; right: 4px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.7); background: #43b581; z-index: 3; }
    .avatar-status.idle { background: #faa61a; }
    .avatar-status.dnd { background: #f04747; }
    .avatar-status.offline { background: #747f8d; }

    .username { font-size: 26px; font-weight: 600; letter-spacing: 0.5px; text-shadow: 0 2px 12px rgba(0,0,0,0.7); }
    .bio { font-size: 13px; font-style: italic; color: rgba(255,255,255,0.85); text-shadow: 0 1px 6px rgba(0,0,0,0.8); max-width: 300px; line-height: 1.5; }
    .location { display: flex; align-items: center; gap: 5px; font-size: 12px; color: rgba(255,255,255,0.6); }
    .location svg { width: 12px; height: 12px; opacity: 0.7; flex-shrink: 0; }

    /* ── DISCORD WIDGET ── */
    .discord-widget { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 8px 14px; cursor: pointer; transition: background 0.2s; text-decoration: none; color: inherit; }
    .discord-widget:hover { background: rgba(0,0,0,0.65); }
    .dw-avatar { position: relative; width: 36px; height: 36px; flex-shrink: 0; }
    .dw-avatar img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .dw-status { position: absolute; bottom: 0; right: 0; width: 11px; height: 11px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.7); background: #43b581; }
    .dw-status.idle { background: #faa61a; }
    .dw-status.dnd { background: #f04747; }
    .dw-status.offline { background: #747f8d; }
    .dw-info { display: flex; flex-direction: column; align-items: flex-start; }
    .dw-name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 5px; }
    .dw-badges { display: flex; gap: 3px; }
    .dw-badges img { width: 16px; height: 16px; }
    .dw-activity { font-size: 11px; color: rgba(255,255,255,0.55); }

    /* ── SOCIALS ── */
    .socials { display: flex; gap: 18px; align-items: center; margin-top: 2px; }
    .social-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.75); transition: color 0.2s, transform 0.2s; cursor: pointer; text-decoration: none; }
    .social-btn:hover { color: #fff; transform: scale(1.15); }
    .social-btn svg { width: 22px; height: 22px; }

    /* ── VIEWS ── */
    .views { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,0.6); position: fixed; bottom: 28px; left: 28px; z-index: 10; }
    .views svg { width: 16px; height: 16px; opacity: 0.7; }

    /* ── MUSIC CONTROLS (bottom right) ── */
    .music-controls { position: fixed; bottom: 24px; right: 16px; z-index: 10; display: flex; align-items: center; gap: 8px; }
    .mute-btn { background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 6px 10px; cursor: pointer; color: rgba(255,255,255,0.7); display: flex; align-items: center; gap: 5px; font-size: 12px; font-family: inherit; transition: background 0.2s; }
    .mute-btn:hover { background: rgba(0,0,0,0.75); color: #fff; }
    .mute-btn svg { width: 15px; height: 15px; }
    .song-name { font-size: 11px; color: rgba(255,255,255,0.45); max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── SETTINGS BTN ── */
    .settings-btn { position: fixed; top: 16px; right: 16px; z-index: 20; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 7px 10px; cursor: pointer; color: rgba(255,255,255,0.7); font-size: 13px; font-family: inherit; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
    .settings-btn:hover { background: rgba(0,0,0,0.75); color: #fff; }

    /* ── PASSWORD GATE ── */
    .pw-gate { position: fixed; top: 52px; right: 16px; z-index: 30; background: rgba(10,10,15,0.96); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 16px; width: 240px; display: none; flex-direction: column; gap: 10px; }
    .pw-gate.open { display: flex; }
    .pw-gate label { font-size: 11px; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 0.6px; }
    .pw-input { width: 100%; padding: 8px 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; color: #fff; font-size: 13px; font-family: inherit; outline: none; }
    .pw-input:focus { border-color: rgba(255,255,255,0.35); }
    .pw-error { font-size: 11px; color: #f04747; display: none; }
    .pw-submit { width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-size: 12px; font-family: inherit; cursor: pointer; transition: background 0.2s; }
    .pw-submit:hover { background: rgba(255,255,255,0.18); }

    /* ── SETTINGS PANEL ── */
    .settings-panel { position: fixed; top: 52px; right: 16px; z-index: 20; background: rgba(10,10,15,0.96); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 16px; width: 284px; display: none; flex-direction: column; gap: 10px; max-height: calc(100vh - 80px); overflow-y: auto; }
    .settings-panel.open { display: flex; }
    .settings-panel label { font-size: 11px; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 3px; display: block; }
    .file-pick-btn { width: 100%; padding: 8px 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; color: rgba(255,255,255,0.8); font-size: 12px; font-family: inherit; cursor: pointer; text-align: left; transition: background 0.2s; }
    .file-pick-btn:hover { background: rgba(255,255,255,0.1); }
    .settings-row { display: flex; flex-direction: column; gap: 4px; }
    .settings-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); outline: none; }
    .settings-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; cursor: pointer; }
    .settings-divider { height: 1px; background: rgba(255,255,255,0.08); }
    .edit-input { width: 100%; padding: 7px 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; color: #fff; font-size: 12px; font-family: inherit; outline: none; }
    .edit-input:focus { border-color: rgba(255,255,255,0.3); }
    .save-btn { width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-size: 12px; font-family: inherit; cursor: pointer; transition: background 0.2s; }
    .save-btn:hover { background: rgba(255,255,255,0.18); }
    .save-status { font-size: 11px; color: rgba(255,255,255,0.5); text-align: center; min-height: 14px; }

    #video-input, #pfp-input, #mp3-input { display: none; }
  </style>
</head>

  <div class="settings-row">
    <label>Location (vuoto = nascosta)</label>
    <input class="edit-input" id="input-location" type="text" placeholder="es. HELL">
  </div>
  <div class="settings-divider"></div>
  <div class="settings-row">
    <label>Link socials (vuoto = nascosto)</label>
    <input class="edit-input" id="inp-discord-link" type="text" placeholder="Discord invite https://discord.gg/...">
    <input class="edit-input" style="margin-top:4px;" id="inp-twitch"    type="text" placeholder="Twitch">
    <input class="edit-input" style="margin-top:4px;" id="inp-paypal"    type="text" placeholder="PayPal.me">
    <input class="edit-input" style="margin-top:4px;" id="inp-github"    type="text" placeholder="GitHub">
    <input class="edit-input" style="margin-top:4px;" id="inp-youtube"   type="text" placeholder="YouTube">
    <input class="edit-input" style="margin-top:4px;" id="inp-tiktok"    type="text" placeholder="TikTok">
    <input class="edit-input" style="margin-top:4px;" id="inp-instagram" type="text" placeholder="Instagram">
  </div>
  <div class="settings-divider"></div>
  <div class="settings-row">
    <label>Opacità overlay</label>
    <input type="range" class="settings-slider" id="overlay-opacity" min="0" max="0.8" step="0.01" value="0.38">
  </div>
  <button class="save-btn" id="save-settings">💾 Salva per tutti</button>
  <div class="save-status" id="save-status"></div>
</div>

<script>
// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════
const ADMIN_PW = 'wh3res981admin';
const API_SETTINGS = '/.netlify/functions/settings';
const API_VIEWS    = '/.netlify/functions/views';

// ═══════════════════════════════════════════
// PASSWORD GATE
// ═══════════════════════════════════════════
let adminUnlocked = sessionStorage.getItem('admin_unlocked') === '1';

document.getElementById('settings-toggle').addEventListener('click', () => {
  if (adminUnlocked) {
    document.getElementById('settings-panel').classList.toggle('open');
    document.getElementById('pw-gate').classList.remove('open');
  } else {
    document.getElementById('pw-gate').classList.toggle('open');
    document.getElementById('settings-panel').classList.remove('open');
  }
});

document.getElementById('pw-submit').addEventListener('click', checkPassword);
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });

function checkPassword() {
  const val = document.getElementById('pw-input').value;
  if (val === ADMIN_PW) {
    adminUnlocked = true;
    sessionStorage.setItem('admin_unlocked', '1');
    document.getElementById('pw-gate').classList.remove('open');
    document.getElementById('pw-error').style.display = 'none';
    document.getElementById('pw-input').value = '';
    document.getElementById('settings-panel').classList.add('open');
  } else {
    document.getElementById('pw-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}

// Close panels clicking outside
document.addEventListener('click', e => {
  const panel = document.getElementById('settings-panel');
  const gate  = document.getElementById('pw-gate');
  const btn   = document.getElementById('settings-toggle');
  if (!panel.contains(e.target) && !gate.contains(e.target) && !btn.contains(e.target)) {
    panel.classList.remove('open');
    gate.classList.remove('open');
  }
});

// ═══════════════════════════════════════════
// LOAD SHARED SETTINGS FROM NETLIFY BLOBS
// ═══════════════════════════════════════════
async function loadSharedSettings() {
  try {
    const res = await fetch(API_SETTINGS);
    if (res.ok) {
      const cfg = await res.json();
      applyAll(cfg);
      populateInputs(cfg);
      return cfg;
    }
  } catch(_) {}
  // fallback: nothing to show
  return {};
}

function populateInputs(c) {
  const map = {
    'input-discord-id':'discord-id','input-username':'username',
    'input-bio':'bio','input-location':'location',
    'inp-discord-link':'discord-link','inp-twitch':'twitch',
    'inp-paypal':'paypal','inp-github':'github',
    'inp-youtube':'youtube','inp-tiktok':'tiktok','inp-instagram':'instagram'
  };
  Object.entries(map).forEach(([id,key]) => {
    const el = document.getElementById(id);
    if (el && c[key] !== undefined) el.value = c[key];
  });
  if (c['overlay-opacity'] !== undefined)
    document.getElementById('overlay-opacity').value = c['overlay-opacity'];
}

// ═══════════════════════════════════════════
// APPLY SETTINGS TO PAGE
// ═══════════════════════════════════════════
function applyAll(c) {
  document.getElementById('username-display').textContent = c.username || 'wh3res981';

  const bio = document.getElementById('bio-display');
  if (c.bio) { bio.textContent = c.bio; bio.style.display = 'block'; }
  else bio.style.display = 'none';

  const loc = document.getElementById('location-display');
  if (c.location) { document.getElementById('location-text').textContent = c.location; loc.style.display = 'flex'; }
  else loc.style.display = 'none';

  if (c['overlay-opacity'] !== undefined)
    document.getElementById('overlay').style.background = `rgba(0,0,0,${c['overlay-opacity']})`;

  const socMap = {'discord-link':'btn-discord','twitch':'btn-twitch','paypal':'btn-paypal','github':'btn-github','youtube':'btn-youtube','tiktok':'btn-tiktok','instagram':'btn-instagram'};
  Object.entries(socMap).forEach(([key,id]) => {
    const btn = document.getElementById(id);
    if (c[key]) { btn.href = c[key]; btn.style.display = 'flex'; }
    else btn.style.display = 'none';
  });

  if (c.videoUrl) setVideo(c.videoUrl);
  if (c.customPfp) document.getElementById('avatar-img').src = c.customPfp;
  if (c.audioUrl) setAudio(c.audioUrl, c.audioName || '');
  if (c['discord-id']) fetchDiscord(c['discord-id'], c);
}

// ═══════════════════════════════════════════
// SAVE SHARED SETTINGS TO NETLIFY BLOBS
// ═══════════════════════════════════════════
document.getElementById('save-settings').addEventListener('click', async () => {
  const statusEl = document.getElementById('save-status');
  statusEl.textContent = 'Salvataggio...';

  // Collect text fields
  const map = {
    'input-discord-id':'discord-id','input-username':'username',
    'input-bio':'bio','input-location':'location',
    'inp-discord-link':'discord-link','inp-twitch':'twitch',
    'inp-paypal':'paypal','inp-github':'github',
    'inp-youtube':'youtube','inp-tiktok':'tiktok','inp-instagram':'instagram'
  };
  const newCfg = {};
  Object.entries(map).forEach(([id,key]) => {
    const el = document.getElementById(id);
    if (el) newCfg[key] = el.value.trim();
  });
  newCfg['overlay-opacity'] = document.getElementById('overlay-opacity').value;

  // Carry over binary blobs from current remote cfg (don't re-upload if not changed)
  try {
    const existing = await (await fetch(API_SETTINGS)).json().catch(()=>({}));
    if (existing.videoUrl && !pendingVideo) newCfg.videoUrl = existing.videoUrl;
    if (existing.customPfp && !pendingPfp)  newCfg.customPfp = existing.customPfp;
    if (existing.audioUrl  && !pendingAudio) { newCfg.audioUrl = existing.audioUrl; newCfg.audioName = existing.audioName; }
  } catch(_) {}

  if (pendingVideo) { newCfg.videoUrl = pendingVideo; pendingVideo = null; }
  if (pendingPfp)   { newCfg.customPfp = pendingPfp; pendingPfp = null; }
  if (pendingAudio) { newCfg.audioUrl = pendingAudio; newCfg.audioName = pendingAudioName; pendingAudio = null; }

  try {
    const res = await fetch(API_SETTINGS, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-pw': ADMIN_PW },
      body: JSON.stringify(newCfg)
    });
    if (res.ok) {
      statusEl.textContent = '✓ Salvato! Tutti vedranno le modifiche.';
      applyAll(newCfg);
      setTimeout(() => { statusEl.textContent = ''; }, 3000);
    } else {
      statusEl.textContent = '✗ Errore nel salvataggio.';
    }
  } catch(e) {
    statusEl.textContent = '✗ Nessuna connessione a Netlify.';
    // Apply locally anyway
    applyAll(newCfg);
  }
  document.getElementById('settings-panel').classList.remove('open');
});

// ═══════════════════════════════════════════
// FILE PICKERS — store as pending until Save
// ═══════════════════════════════════════════
let pendingVideo = null, pendingPfp = null, pendingAudio = null, pendingAudioName = '';

document.getElementById('pick-video').addEventListener('click', () => document.getElementById('video-input').click());
document.getElementById('video-input').addEventListener('change', function() {
  const file = this.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  setVideo(url);
  toBase64(file, b64 => { pendingVideo = b64; });
});

document.getElementById('pick-pfp').addEventListener('click', () => document.getElementById('pfp-input').click());
document.getElementById('pfp-input').addEventListener('change', function() {
  const file = this.files[0]; if (!file) return;
  toBase64(file, b64 => {
    document.getElementById('avatar-img').src = b64;
    pendingPfp = b64;
  });
});

document.getElementById('pick-mp3').addEventListener('click', () => document.getElementById('mp3-input').click());
document.getElementById('mp3-input').addEventListener('change', function() {
  const file = this.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  setAudio(url, file.name);
  toBase64(file, b64 => { pendingAudio = b64; pendingAudioName = file.name; });
});

function toBase64(file, cb) {
  const r = new FileReader();
  r.onload = e => cb(e.target.result);
  r.readAsDataURL(file);
}

// ═══════════════════════════════════════════
// MEDIA HELPERS
// ═══════════════════════════════════════════
function setVideo(url) {
  const v = document.getElementById('bg-video');
  v.src = url; v.play().catch(()=>{});
}

let audioMuted = false;
function setAudio(url, name) {
  const a = document.getElementById('bg-audio');
  a.src = url;
  a.volume = 0.4;
  a.play().catch(()=>{});
  document.getElementById('mute-btn').style.display = 'flex';
  const nameEl = document.getElementById('song-name');
  // strip extension for display
  nameEl.textContent = name.replace(/\.[^.]+$/, '');
}

// OVERLAY SLIDER LIVE
document.getElementById('overlay-opacity').addEventListener('input', function() {
  document.getElementById('overlay').style.background = `rgba(0,0,0,${this.value})`;
});

// MUTE BUTTON
document.getElementById('mute-btn').addEventListener('click', () => {
  const a = document.getElementById('bg-audio');
  audioMuted = !audioMuted;
  a.muted = audioMuted;
  const icon = document.getElementById('mute-icon');
  if (audioMuted) {
    icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>`;
  } else {
    icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
  }
});

// ═══════════════════════════════════════════
// DISCORD / LANYARD
// ═══════════════════════════════════════════
const FLAG_BITS = { STAFF:1,PARTNER:2,HYPESQUAD:4,BUG_HUNTER_LEVEL_1:8,HYPESQUAD_ONLINE_HOUSE_1:64,HYPESQUAD_ONLINE_HOUSE_2:128,HYPESQUAD_ONLINE_HOUSE_3:256,EARLY_SUPPORTER:512,BUG_HUNTER_LEVEL_2:16384,VERIFIED_BOT_DEVELOPER:131072,ACTIVE_DEVELOPER:4194304 };
const BADGE_ICONS = { STAFF:'https://cdn.discordapp.com/badge-icons/5e74e9b61934fc1f67c2da7e4b3b8f0.png',PARTNER:'https://cdn.discordapp.com/badge-icons/3f9748e53446a137a052f3454e2de41e.png',HYPESQUAD:'https://cdn.discordapp.com/badge-icons/bf01d1073931f921909045f3a39fd264.png',BUG_HUNTER_LEVEL_1:'https://cdn.discordapp.com/badge-icons/2717692c7dca7289b35297368a940dd0.png',BUG_HUNTER_LEVEL_2:'https://cdn.discordapp.com/badge-icons/848f79194d4be5ff5f81505cbd0ce1e6.png',HYPESQUAD_ONLINE_HOUSE_1:'https://cdn.discordapp.com/badge-icons/8a88d63823d8a71cd5e390baa45efa02.png',HYPESQUAD_ONLINE_HOUSE_2:'https://cdn.discordapp.com/badge-icons/011940fd013082d99d55e817eb09b0a7.png',HYPESQUAD_ONLINE_HOUSE_3:'https://cdn.discordapp.com/badge-icons/3aa41de486fa12454c3761e8e223442e.png',EARLY_SUPPORTER:'https://cdn.discordapp.com/badge-icons/7060786766c9c840eb3019e725d2b358.png',VERIFIED_BOT_DEVELOPER:'https://cdn.discordapp.com/badge-icons/6df5892e0f35b051f8b61eace34f4967.png',ACTIVE_DEVELOPER:'https://cdn.discordapp.com/badge-icons/6bdc42827a38498929a4920da12695d9.png',NITRO:'https://cdn.discordapp.com/badge-icons/2ba85e8026a8614b640c2837bcdfe21b.png' };

function statusClass(s) { return {online:'',idle:'idle',dnd:'dnd',offline:'offline'}[s]||'offline'; }

async function fetchDiscord(userId, c) {
  try {
    const res = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
    const json = await res.json();
    if (!json.success) return;
    const d = json.data, u = d.discord_user;
    const avatarUrl = u.avatar
      ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${u.avatar.startsWith('a_')?'gif':'png'}?size=128`
      : `https://cdn.discordapp.com/embed/avatars/${parseInt(u.discriminator||'0')%5}.png`;

    if (!c.customPfp) document.getElementById('avatar-img').src = avatarUrl;

    if (u.avatar_decoration_data) {
      const ring = document.getElementById('decoration-ring');
      ring.src = `https://cdn.discordapp.com/avatar-decoration-presets/${u.avatar_decoration_data.asset}.png?size=240&passthrough=true`;
      ring.style.display = 'block';
    }

    const sc = statusClass(d.discord_status);
    document.getElementById('avatar-status').className = 'avatar-status ' + sc;

    const widget = document.getElementById('discord-widget');
    widget.style.display = 'flex';
    if (c['discord-link']) widget.href = c['discord-link'];
    document.getElementById('dw-avatar-img').src = avatarUrl;
    document.getElementById('dw-status').className = 'dw-status ' + sc;
    document.getElementById('dw-name-text').textContent = u.global_name || u.username;

    const bc = document.getElementById('dw-badges');
    bc.innerHTML = '';
    if (u.public_flags) {
      Object.entries(FLAG_BITS).forEach(([key,bit]) => {
        if ((u.public_flags & bit) && BADGE_ICONS[key]) {
          const img = document.createElement('img');
          img.src = BADGE_ICONS[key]; img.title = key.replace(/_/g,' ');
          img.style.cssText='width:16px;height:16px;'; bc.appendChild(img);
        }
      });
    }
    if (u.avatar_decoration_data) {
      const img = document.createElement('img');
      img.src = BADGE_ICONS['NITRO']; img.title='Nitro';
      img.style.cssText='width:16px;height:16px;'; bc.appendChild(img);
    }

    const actEl = document.getElementById('dw-activity');
    if (d.activities && d.activities.length) {
      const act = d.activities.find(a=>a.type!==4)||d.activities[0];
      actEl.textContent = act.type===4&&act.state ? act.state : act.name ? 'Playing '+act.name : d.discord_status;
    } else {
      actEl.textContent = d.discord_status==='offline'?'Offline':d.discord_status;
    }
  } catch(e) { console.warn('Lanyard:',e); }
}

// ═══════════════════════════════════════════
// VIEW COUNTER
// ═══════════════════════════════════════════
async function updateViews() {
  try {
    let count;
    try {
      const res = await fetch(API_VIEWS, {method:'POST'});
      if (res.ok) { const d = await res.json(); count = d.views; }
    } catch(_) {}
    if (!count) {
      let v = parseInt(localStorage.getItem('wh3_views')||'0');
      if (!sessionStorage.getItem('wh3_counted')) { v++; localStorage.setItem('wh3_views',v); sessionStorage.setItem('wh3_counted','1'); }
      count = v;
    }
    document.getElementById('view-count').textContent = Number(count).toLocaleString();
  } catch(e) { console.warn(e); }
}

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
loadSharedSettings();
updateViews();
</script>
</body>
</html>
